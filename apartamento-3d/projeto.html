<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projeto executivo · Apto 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#E9EBEE;--ink:#1D232A;--muted:#5D6670;--panel:#fff;--line:#D5DAE0;--accent:#2E5A84}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15191E;--ink:#E7EBEF;--muted:#9FA9B5;--panel:#1C2128;--line:#343C47;--accent:#8FB8E2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191E;--ink:#E7EBEF;--muted:#9FA9B5;--panel:#1C2128;--line:#343C47;--accent:#8FB8E2;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.top h1{margin:0;font-size:20px;font-weight:700}
.top p{margin:0;font-size:13px;color:var(--muted)}
.top nav{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.top a{color:var(--accent);text-decoration:none} .top a:hover{text-decoration:underline}
main{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:1500px;aspect-ratio:420/297;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.sheet svg{display:block;width:100%;height:100%}
@media print{
  @page{size:420mm 297mm;margin:0}
  html,body{background:#fff}
  .top{display:none} main{padding:0;gap:0;display:block}
  .sheet{width:420mm;height:297mm;max-width:none;box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div class="top">
  <h1>Projeto executivo de interiores · Apartamento 02</h1>
  <p>12 pranchas A3, geradas a partir do mesmo modelo do 3D. Conferir as medidas no local antes de executar.</p>
  <nav id="nav"></nav>
</div>
<main id="main"></main>
<script src="dados.js"></script>
<script>
(function(){
'use strict';
/* ============ utilidades ============ */
const F=(v,d=2)=>Number(v).toFixed(d).replace('.',',');
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const n1=v=>Math.round(v*100)/100;
const DATA='17/11/2026', TOTAL=12;
const FONT="Barlow Semi Condensed, Arial Narrow, sans-serif", MONO="IBM Plex Mono, monospace";
const PAL={}; PROP.paleta.forEach(p=>PAL[p.cod]=p);
function T(x,y,txt,o={}){ return `<text x="${n1(x)}" y="${n1(y)}" font-family="${o.mono?MONO:FONT}" font-size="${o.s||2.6}" font-weight="${o.w||400}" fill="${o.c||'#222'}" text-anchor="${o.a||'start'}"${o.rot?` transform="rotate(${o.rot} ${n1(x)} ${n1(y)})"`:''}${o.ls?` letter-spacing="${o.ls}"`:''}>${esc(txt)}</text>`; }
function L(x1,y1,x2,y2,c='#222',w=0.25,da){ return `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${c}" stroke-width="${w}"${da?` stroke-dasharray="${da}"`:''}/>`; }
function Rc(x,y,w,h,o={}){ return `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" fill="${o.f||'none'}" stroke="${o.s||'#222'}" stroke-width="${o.w===undefined?0.25:o.w}"${o.da?` stroke-dasharray="${o.da}"`:''}${o.rx?` rx="${o.rx}"`:''}${o.op?` fill-opacity="${o.op}"`:''}/>`; }
function C(x,y,r,o={}){ return `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}" fill="${o.f||'none'}" stroke="${o.s||'#222'}" stroke-width="${o.w===undefined?0.25:o.w}"${o.da?` stroke-dasharray="${o.da}"`:''}/>`; }
function PG(pts,o={}){ return `<polygon points="${pts.map(p=>n1(p[0])+','+n1(p[1])).join(' ')}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.w||0.25}"${o.op?` fill-opacity="${o.op}"`:''}${o.clip?` clip-path="url(#${o.clip})"`:''}/>`; }
function PL(pts,o={}){ return `<polyline points="${pts.map(p=>n1(p[0])+','+n1(p[1])).join(' ')}" fill="none" stroke="${o.s||'#222'}" stroke-width="${o.w||0.25}"${o.da?` stroke-dasharray="${o.da}"`:''}/>`; }
function wrap(txt,max){ const w=String(txt).split(' '), out=[]; let cur=''; for(const x of w){ if((cur+' '+x).trim().length>max){ if(cur) out.push(cur); cur=x; } else cur=(cur+' '+x).trim(); } if(cur) out.push(cur); return out; }
function TW(x,y,txt,max,o={}){ const lh=o.lh||(o.s||2.6)*1.35; return wrap(txt,max).map((l,i)=>T(x,y+i*lh,l,o)).join(''); }
function pip(x,y,p){ let c=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1]; if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function roomAt(x,y){ for(const r of ROOMS) for(const p of r.floor) if(pip(x,y,p)) return r.id; return null; }
const LAM=new Set(PROP.laminado.rooms), DRY=new Set(['sala','circ','suite','quarto1','quarto2','qemp']);
const area=r=>parseFloat(r.m2.replace(',','.'));
const RM=id=>ROOMS.find(r=>r.id===id);

/* ============ dimensão (cota) ============ */
function dim(x1,y1,x2,y2,off,txt,o={}){ // cota alinhada; off = deslocamento perpendicular (mm)
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
  const a1=[x1+nx*off,y1+ny*off], a2=[x2+nx*off,y2+ny*off], ext=Math.sign(off)||1;
  let s=L(x1+nx*ext*0.8,y1+ny*ext*0.8,a1[0]+nx*ext*1.2,a1[1]+ny*ext*1.2,'#444',0.13)+L(x2+nx*ext*0.8,y2+ny*ext*0.8,a2[0]+nx*ext*1.2,a2[1]+ny*ext*1.2,'#444',0.13);
  s+=L(a1[0]-ux*1.2,a1[1]-uy*1.2,a2[0]+ux*1.2,a2[1]+uy*1.2,'#444',0.18);
  for(const a of [a1,a2]) s+=L(a[0]-0.9*(ux-nx),a[1]-0.9*(uy-ny),a[0]+0.9*(ux-nx),a[1]+0.9*(uy-ny),'#222',0.3);
  const mx=(a1[0]+a2[0])/2+nx*ext*1.1, my=(a1[1]+a2[1])/2+ny*ext*1.1, ang=Math.atan2(dy,dx)*180/Math.PI;
  const rot=(ang>90||ang<-90)?ang+180:ang;
  s+=`<text x="${n1(mx)}" y="${n1(my)}" font-family="${FONT}" font-size="${o.s||2.3}" fill="#222" text-anchor="middle" dominant-baseline="${ext>0?'hanging':'auto'}" transform="rotate(${n1(rot)} ${n1(mx)} ${n1(my)})">${esc(txt)}</text>`;
  return s;
}
const m2t=v=>F(v,2);

/* ============ folha, moldura e carimbo ============ */
function sheet(num,title,escala,body,notes){
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" width="420mm" height="297mm" role="img" aria-label="${esc(title)}">`;
  s+=`<rect width="420" height="297" fill="#fff"/>`+Rc(15,7,398,283,{w:0.6});
  // carimbo
  const cx=233, cy=252, cw=180, ch=38;
  s+=Rc(cx,cy,cw,ch,{w:0.5});
  s+=T(cx+3,cy+5,'PROJETO DE INTERIORES · APARTAMENTO 02 · PAVIMENTO TIPO',{s:2.4,w:600,ls:0.2});
  s+=T(cx+3,cy+13.2,title.toUpperCase(),{s:5.2,w:700});
  s+=L(cx,cy+16.5,cx+cw,cy+16.5,'#222',0.25);
  const cols=[['ETAPA','Executivo'],['ESCALA',escala],['DATA',DATA],['FOLHA',`${String(num).padStart(2,'0')}/${TOTAL}`],['REVISÃO','R00']];
  const cwid=cw/cols.length; cols.forEach(([k,v],i)=>{ const x=cx+i*cwid; if(i) s+=L(x,cy+16.5,x,cy+27,'#222',0.2); s+=T(x+2,cy+19.8,k,{s:1.8,c:'#666',ls:0.2})+T(x+2,cy+25,v,{s:3.1,w:600}); });
  s+=L(cx,cy+27,cx+cw,cy+27,'#222',0.25);
  s+=T(cx+3,cy+31,'RESPONSÁVEL TÉCNICO',{s:1.8,c:'#666',ls:0.2})+T(cx+3,cy+35.6,'______________________________  CAU/CREA nº ____________',{s:2.4});
  s+=T(cx+cw-3,cy+35.6,'Cotas em metros · conferir no local',{s:2.1,a:'end',c:'#444'});
  // notas
  s+=Rc(15,252,215,38,{w:0.35});
  s+=T(18,256.6,'NOTAS',{s:2.2,w:700,ls:0.3});
  const ns=(notes||[]).concat(['Projeto elaborado sobre a planta do pavimento tipo e fotos do imóvel; medidas e posições de janelas a confirmar no local antes de compras e marcenaria.']);
  let ny=260.5; ns.forEach((n,i)=>{ const lines=wrap(`${i+1}. ${n}`,150); lines.forEach(l=>{ if(ny<289) s+=T(18,ny,l,{s:2.05}); ny+=2.75; }); });
  s+=body+'</svg>';
  return `<section class="sheet" id="f${num}">${s}</section>`;
}
function tableSVG(x,y,cols,rows,o={}){ // cols: [{h,w,a}] ; rows: arrays
  const rh=o.rh||4.2, fs=o.fs||2.2; let s='', cx=x; const W=cols.reduce((a,c)=>a+c.w,0);
  s+=Rc(x,y,W,rh,{f:'#1D232A',s:'#1D232A'});
  cols.forEach(c=>{ s+=T(cx+1.2,y+rh-1.25,c.h,{s:fs*0.92,w:600,c:'#fff',ls:0.15}); cx+=c.w; });
  let yy=y+rh;
  rows.forEach((r,ri)=>{
    const wrapped=r.map((v,i)=>cols[i].wrap?wrap(v,cols[i].wrap):[String(v)]); const nl=Math.max(...wrapped.map(w=>w.length)); const h=Math.max(rh,nl*fs*1.3+1.6);
    if(ri%2) s+=Rc(x,yy,W,h,{f:'#F2F3F4',s:'none',w:0});
    let xx=x; wrapped.forEach((lines,i)=>{ const c=cols[i];
      if(c.sw && r[i]) { s+=Rc(xx+1,yy+0.9,h-1.8,h-1.8,{f:r[i],s:'#555',w:0.15}); }
      else lines.forEach((l,k)=>{ s+=T(c.a==='end'?xx+c.w-1.2:xx+1.2,yy+fs*1.05+0.8+k*fs*1.3,l,{s:fs,a:c.a||'start',mono:c.mono,w:c.b?600:400}); });
      xx+=c.w; });
    yy+=h; s+=L(x,yy,x+W,yy,'#999',0.12);
  });
  s+=Rc(x,y,W,yy-y,{w:0.3});
  return {s, h:yy-y};
}

/* ============ planta (paredes, aberturas) ============ */
function planBase(s,ox,oy,opt={}){
  const k=1000/s, P=(x,y)=>[ox+x*k,oy+y*k], PP=pts=>pts.map(p=>P(p[0],p[1]));
  let floor='', walls='', open='', ctx='';
  ctx+=PG(PP(HALL),{f:'#EEF0F2',s:'#BBB',w:0.15});
  for(const e of [[14.22,0.62,15.35,2.45],[15.39,0.62,16.52,2.45]]){ const a=P(e[0],e[1]), b=P(e[2],e[3]); ctx+=Rc(a[0],a[1],b[0]-a[0],b[1]-a[1],{f:'#E3E6E9',s:'#AAA',w:0.15})+L(a[0],a[1],b[0],b[1],'#AAA',0.12)+L(b[0],a[1],a[0],b[1],'#AAA',0.12); }
  floor+=PG(PP(OUTLINE),{f:'#fff',s:'none'});
  if(opt.roomFill) for(const r of ROOMS){ const f=opt.roomFill(r); if(f) for(const p of r.floor) floor+=PG(PP(p),{f, op:opt.roomOp||1}); }
  const wc=opt.wallColor||'#2B2B2B';
  for(const w of WALLS){
    const [x0,x1,y0,y1]=w.r, ax=(x1-x0)>=(y1-y0), A0=ax?x0:y0, A1=ax?x1:y1, C0=ax?y0:x0, C1=ax?y1:x1, cm=(C0+C1)/2, th=C1-C0;
    const RR=(a,b)=>ax?[a,C0,b,C1]:[C0,a,C1,b], pt=(a,c)=>ax?P(a,c):P(c,a);
    const box=(a,b,f)=>{ const r=RR(a,b), p=P(r[0],r[1]), q=P(r[2],r[3]); return Rc(p[0],p[1],q[0]-p[0],q[1]-p[1],{f,s:'none',w:0}); };
    let cur=A0;
    for(const op of (w.ops||[]).slice().sort((p,q)=>p.a-q.a)){
      if(op.a-cur>1e-3) walls+=box(cur,op.a,wc);
      if(op.t==='door'||op.t==='main'){
        const hs=op.hinge!=='end', ha=hs?op.a:op.b, wd=op.b-op.a, cd=hs?1:-1, n=op.swing, face=cm+n*th/2, arc=[];
        for(let i=0;i<=18;i++){ const t=i/18*Math.PI/2; arc.push(pt(ha+cd*wd*Math.cos(t), face+n*wd*Math.sin(t))); }
        if(opt.doors!==false){ open+=PL(arc,{s:'#777',w:0.15,da:'1 0.8'}); const p=pt(ha,face), q=pt(ha,face+n*wd); open+=L(p[0],p[1],q[0],q[1],'#222',0.35); }
        const a=pt(op.a,C0), b=pt(op.a,C1), c=pt(op.b,C0), d=pt(op.b,C1); open+=L(a[0],a[1],b[0],b[1],'#222',0.2)+L(c[0],c[1],d[0],d[1],'#222',0.2);
      } else if(op.t==='win'||op.t==='pj'){
        walls+=box(op.a,op.b,'#fff'); const r=RR(op.a,op.b), p=P(r[0],r[1]), q=P(r[2],r[3]); open+=Rc(p[0],p[1],q[0]-p[0],q[1]-p[1],{s:'#222',w:0.2});
        const g1=pt(op.a,cm-0.015), g2=pt(op.b,cm-0.015), g3=pt(op.a,cm+0.015), g4=pt(op.b,cm+0.015); open+=L(g1[0],g1[1],g2[0],g2[1],'#222',0.15)+L(g3[0],g3[1],g4[0],g4[1],'#222',0.15);
      } else if(op.t==='open'){ const a=pt(op.a,C0), b=pt(op.a,C1), c=pt(op.b,C0), d=pt(op.b,C1); open+=L(a[0],a[1],c[0],c[1],'#999',0.12,'1 0.8')+L(b[0],b[1],d[0],d[1],'#999',0.12,'1 0.8'); }
      cur=op.b;
    }
    if(A1-cur>1e-3) walls+=box(cur,A1,wc);
  }
  walls+=PG(PP(arcPts(Q1.cx,Q1.cy,Q1.r,Math.PI,Math.PI*1.5,18).concat(arcPts(Q1.cx,Q1.cy,Q1.r+0.15,Math.PI*1.5,Math.PI,18))),{f:wc});
  open+=PL(PP(railPts()),{s:'#222',w:0.45});
  const c0=P(-0.6,opt.ymin===undefined?-0.62:opt.ymin), c1=P(16.75,8.4); const cid='pc'+(planBase.n=(planBase.n||0)+1);
  return {P,PP,k,svg:`<defs><clipPath id="${cid}"><rect x="${n1(c0[0])}" y="${n1(c0[1])}" width="${n1(c1[0]-c0[0])}" height="${n1(c1[1]-c0[1])}"/></clipPath></defs><g clip-path="url(#${cid})">`+ctx+floor+(opt.under||'')+walls+open+'</g>'};
}
function roomTags(P,o={}){ let s='';
  for(const r of ROOMS){ const [x,y]=P(r.lbl[0],r.lbl[1]);
    const nm=r.id==='area'?'Área de serviço':r.id==='qemp'?'Quarto de serviço':r.id==='wcserv'?'WC de serviço':r.name;
    s+=T(x,y-0.6,nm.toUpperCase(),{s:o.s||2.3,w:700,a:'middle',ls:0.15});
    s+=T(x,y+2.6,`${r.m2} m²${o.extra?(' · '+o.extra(r)):''}`,{s:(o.s||2.3)*0.85,a:'middle',c:'#444'});
  } return s; }
function scaleBar(x,y,s){ const k=1000/s; let o=''; for(let i=0;i<4;i++) o+=Rc(x+i*k,y,k,1.4,{f:i%2?'#fff':'#222',s:'#222',w:0.15}); for(let i=0;i<=4;i++) o+=T(x+i*k,y+4.2,i+(i===4?' m':''),{s:2,a:'middle'}); o+=T(x,y-1.6,`ESCALA 1:${s}`,{s:2.1,w:600,ls:0.2}); return o; }
function tag(x,y,txt,o={}){ const w=txt.length*1.25+2.4; return Rc(x-w/2,y-1.9,w,3.8,{f:o.f||'#fff',s:o.s||'#222',w:0.2,rx:1.9})+T(x,y+0.85,txt,{s:2.05,w:600,a:'middle',c:o.c||'#222'}); }

/* ============ pegadas do mobiliário (planta) ============ */
function kRect(m){ return m.wall==='N'?[m.a,1.02,m.b,1.02+m.dep]:[14.10-m.dep,m.a,14.10,m.b]; }
function furnSVG(P,opt={}){
  let s=''; const R=(r,o)=>{ const a=P(r[0],r[1]), b=P(r[2],r[3]); return Rc(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),o); };
  const st={s:'#555',w:0.2,f:'#fff'}, k=1000/opt.s;
  for(const it of PROP.itens){
    switch(it.kind){
      case 'rug': s+=R(it.r,{s:'#9A8E7C',w:0.2,da:'1.2 0.8',f:'#F4EFE6'}); break;
      case 'ripado': case 'rack': case 'sideboard': s+=R(it.r,{s:'#8A6A48',w:0.25,f:'#EAD9C3'}); break;
      case 'tv': s+=R([it.cx-0.615,0.04,it.cx+0.615,0.075],{s:'#222',w:0.3,f:'#444'}); break;
      case 'sofa': { const [x0,y0,x1,y1]=it.r; s+=R(it.r,st)+R([x0,y1-0.22,x1,y1],st)+R([x0,y0,x0+0.18,y1],st)+R([x1-0.18,y0,x1,y1],st); const cw=(x1-x0-0.36)/3; for(let i=1;i<3;i++){ const a=P(x0+0.18+cw*i,y0), b=P(x0+0.18+cw*i,y1-0.22); s+=L(a[0],a[1],b[0],b[1],'#888',0.15); } break; }
      case 'armchair': { const [x,y]=P(it.cx,it.cy); s+=C(x,y,0.40*k,st); break; }
      case 'roundtable': case 'dining': { const [x,y]=P(it.cx,it.cy); s+=C(x,y,it.rad*k,{s:'#8A6A48',w:0.25,f:'#F1E6D6'}); break; }
      case 'chairs': for(const d of it.angs){ const a=d*Math.PI/180, [x,y]=P(it.cx+Math.cos(a)*it.dist,it.cy+Math.sin(a)*it.dist); s+=`<rect x="${n1(x-0.225*k)}" y="${n1(y-0.225*k)}" width="${n1(0.45*k)}" height="${n1(0.45*k)}" fill="#fff" stroke="#555" stroke-width="0.2" transform="rotate(${d+90} ${n1(x)} ${n1(y)})"/>`; } break;
      case 'floorlamp': { const [x,y]=P(it.cx,it.cy); s+=C(x,y,0.22*k,{s:'#555',w:0.2,da:'0.8 0.6'})+C(x,y,0.6,{f:'#555',s:'none'}); break; }
      case 'plant': { const [x,y]=P(it.cx,it.cy); const r=(it.type==='tall'?0.30:it.type==='monstera'?0.30:0.24)*k*it.size/0.8; s+=C(x,y,r,{f:'#DCE6D2',s:'#7C9A68',w:0.2}); break; }
      case 'curtain': { const pts=[]; for(let y=it.a;y<=it.b+1e-6;y+=0.04) pts.push(P(it.x+Math.sin((y-it.a)/0.04*Math.PI/2)*0.025,y)); s+=PL(pts,{s:'#8A7A62',w:0.25}); break; }
      case 'bistro': { const [x,y]=P(it.cx,it.cy); s+=C(x,y,0.30*k,st); for(const dy of [-0.55,0.55]){ const [a,b]=P(it.cx,it.cy+dy); s+=C(a,b,0.22*k,st); } break; }
    }
  }
  // cozinha
  for(const m of PROP.cozinha){ const r=kRect(m), up=(m.tipo==='aereo'||m.tipo==='depurador'||m.tipo==='micro'||m.tipo==='nicho');
    s+=R(r,{s:up?'#777':'#444',w:up?0.15:0.22,da:up?'1 0.7':null,f:up?'none':(m.tipo==='geladeira'||m.tipo==='fogao'||m.tipo==='lavalouca'?'#E1E4E6':'#fff')});

function wallPieces(){ // trechos sólidos (inclui peitoris) para rodapé e pintura
  const out=[];
  for(const w of WALLS){ const [x0,x1,y0,y1]=w.r, ax=(x1-x0)>=(y1-y0), A0=ax?x0:y0, A1=ax?x1:y1, C0=ax?y0:x0, C1=ax?y1:x1;
    let cur=A0; for(const op of (w.ops||[]).slice().sort((p,q)=>p.a-q.a)){
      if(op.a>cur) out.push({ax,C0,C1,a:cur,b:op.a,z0:0,z1:PE_DIREITO});
      if(op.t==='win'){ out.push({ax,C0,C1,a:op.a,b:op.b,z0:0,z1:op.sill}); out.push({ax,C0,C1,a:op.a,b:op.b,z0:op.head,z1:PE_DIREITO}); }
      else if(op.t==='door'||op.t==='main') out.push({ax,C0,C1,a:op.a,b:op.b,z0:2.10,z1:PE_DIREITO,door:op});
      else if(op.t==='open') out.push({ax,C0,C1,a:op.a,b:op.b,z0:op.head||PE_DIREITO,z1:PE_DIREITO,open:op});
      else if(op.t==='pj') out.push({ax,C0,C1,a:op.a,b:op.b,z0:op.top||2.2,z1:PE_DIREITO,pj:op});
      cur=op.b; }
    if(A1>cur) out.push({ax,C0,C1,a:cur,b:A1,z0:0,z1:PE_DIREITO});
  } return out;
}
function faceSamples(p,side){ // amostras do lado 0 (C0) ou 1 (C1)
  const res=[], n=Math.max(1,Math.round((p.b-p.a)/0.05)), step=(p.b-p.a)/n;
  for(let i=0;i<n;i++){ const t=p.a+(i+0.5)*step, c=side?p.C1+0.06:p.C0-0.06; res.push({t,room:p.ax?roomAt(t,c):roomAt(c,t),step}); }
  return res;
}
function accentAt(p,side,t){ for(const f of PROP.faces){ const c=side?p.C1:p.C0; if(f.ax===(p.ax?'x':'y') && Math.abs(f.c-c)<0.02 && t>=f.a && t<=f.b) return f.cod; } return null; }
const Q={}; (function compute(){
  let rod=0; const paint={}; PROP.paleta.forEach(p=>paint[p.cod]=0);
  for(const p of wallPieces()) for(const side of [0,1]) for(const s of faceSamples(p,side)){
    if(s.room&&LAM.has(s.room)&&p.z0===0) rod+=s.step;
    if(s.room&&DRY.has(s.room)){ const cod=accentAt(p,side,s.t)||'PT-01'; paint[cod]+=s.step*(p.z1-p.z0); }
  }
  const arcL=Q1.r*Math.PI/2; rod+=arcL; paint['PT-01']+=arcL*PE_DIREITO;
  paint['PT-04']=(PROP.arco.w*(PROP.arco.h-PROP.arco.w/2)+Math.PI*(PROP.arco.w/2)**2/2); paint['PT-01']-=paint['PT-04'];
  paint['PT-02']=ROOMS.filter(r=>r.id!=='varanda').reduce((a,r)=>a+area(r),0);
  Q.rodape=rod; Q.paint=paint;
  Q.lam=PROP.laminado.rooms.map(id=>({id,nome:RM(id).name,a:area(RM(id))})); Q.lamTotal=Q.lam.reduce((a,r)=>a+r.a,0);
  const trans=[], juntas=[];
  for(const w of WALLS){ const [x0,x1,y0,y1]=w.r, ax=(x1-x0)>=(y1-y0), C0=ax?y0:x0, C1=ax?y1:x1;
    for(const op of (w.ops||[])){ if(!['door','main','pj','open'].includes(op.t)) continue; const m=(op.a+op.b)/2;
      const r0=ax?roomAt(m,C0-0.08):roomAt(C0-0.08,m), r1=ax?roomAt(m,C1+0.08):roomAt(C1+0.08,m);
      const l0=LAM.has(r0), l1=LAM.has(r1), item={w:op.b-op.a, r0, r1, ax, a:op.a, b:op.b, cm:(C0+C1)/2};
      if(l0&&l1) juntas.push(item); else if(l0||l1) trans.push(item); } }
  Q.trans=trans; Q.juntas=juntas;
})();
